<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positivus</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        font-family: "Space Grotesk", sans-serif;
      }
    </style>
  </head>

  <body class="bg-white">
    <header class="max-w-[1440px] mx-auto px-24 py-10">
      <nav class="flex justify-between items-center">
        <img src="logo.svg" alt="Logo" class="h-14" />

        <ul class="flex items-center gap-10 text-[20px] font-normal">
          <li>
            <a href="#" class="hover:underline underline-offset-4">About Us</a>
          </li>

          <li>
            <a href="#" class="hover:underline underline-offset-4">Services</a>
          </li>

          <li>
            <a href="#" class="hover:underline underline-offset-4">Use Cases</a>
          </li>

          <li>
            <a href="#" class="hover:underline underline-offset-4">Pricing</a>
          </li>

          <li>
            <a href="#" class="hover:underline underline-offset-4">Blog</a>
          </li>
        </ul>

        <button
          class="border border-black rounded-xl px-7 py-4 hover:bg-black hover:text-white transition"
        >
          Request a quote
        </button>
      </nav>
    </header>

    <main class="max-w-[1440px] mx-auto px-24">
      <section class="flex justify-between items-center gap-20 mt-16">
        <div class="w-1/2">
          <h1 class="text-6xl font-bold leading-tight">
            Navigating the <br />
            digital landscape <br />
            for success
          </h1>

          <p class="text-lg text-gray-600 leading-8 mt-8 w-[500px]">
            Our digital marketing agency helps businesses grow and succeed
            online through a range of services including SEO, PPC, social media
            marketing, and content creation.
          </p>

          <button
            class="mt-10 bg-black text-white px-8 py-4 rounded-xl hover:bg-gray-800 transition"
          >
            Book a consultation
          </button>
        </div>

        <div class="w-1/2 flex justify-end">
          <img
            src="Illustration.svg"
            alt="Illustration"
            class="w-full max-w-[550px]"
          />
        </div>
      </section>

      <section class="flex justify-between items-center mt-24 ga-8 p-6">
        <img
          src="Amazon.svg"
          alt="Amazon"
          class="grayscale opacity-70  transition duration-300 hover:grayscale-0 hover:opacity-100"
        />

        <img
          src="drillle.svg"
          alt="Dribbble"
          class="grayscale opacity-70 transition duration-300 hover:grayscale-0 hover:opacity-100"
        />

        <img
          src="hub spot.svg"
          alt="HubSpot"
          class="grayscale opacity-70 transition duration-300 hover:grayscale-0 hover:opacity-100"
        />

        <img
          src="Vector.svg"
          alt="Notion"
          class="grayscale opacity-70 transition-all duration-300 hover:grayscale-0 hover:opacity-100"
        />

        <img
          src="Vector (1).svg"
          alt="Netflix"
          class="grayscale opacity-70 transition-all duration-300 hover:grayscale-0 hover:opacity-100"
        />

        <img
          src="zoom.svg"
          alt="Zoom"
          class="grayscale opacity-70 transition-all duration-300 hover:grayscale-0 hover:opacity-100"
        />
      </section>
    </main>
  </body>
</html>
