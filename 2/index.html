<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positivus - Complete Layout</title>
    
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Custom Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Space Grotesk"', "sans-serif"],
            },
            colors: {
              dark: "#191A23",
              green: "#B9FF66"
            },
          },
        },
      };
    </script>
</head>


<body class="bg-white text-dark font-sans pt-[150px] pb-50 ">

 
    <header class="fixed top-0 left-0 w-full bg-white z-50 py-[30px]">
      <div class="max-w-[1440px] mx-auto px-[100px] flex items-center justify-between">
        
        <a href="#">
            <img src="logo.svg" alt="Positivus Logo" class="h-[35px]" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x40?text=Positivus+Logo';" />
        </a>
        
        <nav class="flex items-center gap-[40px] text-[20px]">
            <a href="#" class="hover:underline underline-offset-4">About us</a>
            <a href="#" class="hover:underline underline-offset-4">Services</a>
            <a href="#" class="hover:underline underline-offset-4">Use Cases</a>
            <a href="#" class="hover:underline underline-offset-4">Pricing</a>
            <a href="#" class="hover:underline underline-offset-4">Blog</a>
            
            <a href="#" class="border border-dark rounded-[14px] text-[20px] font-medium px-8 py-4 hover:bg-dark hover:text-white transition-all duration-300 ml-[10px]">
                Request a quote
            </a>
        </nav>

      </div>
    </header>

    <main class="max-w-[1440px] mx-auto px-[100px] flex flex-col gap-[70px]">

      
        <section class="flex items-center justify-between gap-[30px]">
            
            <!-- Left Side: Text Content -->
            <div class="w-1/2 flex flex-col items-start gap-[35px]">
                <h1 class="text-[60px] font-medium leading-[1.1] text-dark">
                    Navigating the<br> digital landscape<br> for success
                </h1>
                
                <p class="text-[20px] text-[#333] leading-relaxed max-w-[500px]">
                    Our digital marketing agency helps businesses grow and succeed online through a range of services including SEO, PPC, social media marketing, and content creation.
                </p>
                
                <a href="#" class="bg-dark text-white px-[35px] py-[20px] rounded-[14px] text-[20px] font-medium hover:bg-gray-800 transition-all duration-300 mt-[5px]">
                    Book a consultation
                </a>
            </div>

            <div class="w-1/2 flex justify-end">
                <img src="Illustration.svg" alt="Digital Marketing Illustration" class="w-full max-w-[600px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x450?text=Megaphone+Illustration';" />
            </div>
            
        </section>

  
        <section class="flex justify-between items-center grayscale opacity-80 pt-[20px] h-[48px]">
            <img src="amazone.svg" alt="Amazon" class="h-[35px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x35?text=amazon';" />
            <img src="drillle.svg" alt="Dribbble" class="h-[35px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x35?text=dribbble';" />
            <img src="hub spot.svg" alt="HubSpot" class="h-[35px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x35?text=HubSpot';" />
            <img src="Vector.svg" alt="Notion" class="h-[35px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x35?text=Notion';" />
            <img src="Vector (1).svg" alt="Netflix" class="h-[35px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x35?text=NETFLIX';" />
            <img src="zoom.svg" alt="Zoom" class="h-[35px] object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x35?text=zoom';" />
        </section>

    </main>

</body>
</html>
